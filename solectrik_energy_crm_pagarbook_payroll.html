    function getTodayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getCurrentYearMonth() {
      return getTodayISO().slice(0, 7); // YYYY-MM
    }

    function getDaysInMonth(yearMonth) {
      const [y, m] = yearMonth.split('-').map(Number);
      return new Date(y, m, 0).getDate();
    }

    function formatMonthLabel(yearMonth) {
      const [y, m] = yearMonth.split('-').map(Number);
      return new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
    }

    function formatINR(amount) {
      const num = Number(amount) || 0;
      const isNeg = num < 0;
      const formatted = Math.abs(Math.round(num)).toLocaleString('en-IN');
      return `${isNeg ? '-' : ''}₹${formatted}`;
    }

    function formatTimeNow() {
      return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    function formatDateShort(isoDate) {
      if (!isoDate) return '-';
      const [y, m, d] = isoDate.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseShiftHours(start, end) {
      if (!start || !end) return 9;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      const diff = ((eh * 60 + em) - (sh * 60 + sm)) / 60;
      return diff > 0 ? diff : 9;
    }

    /* =========================================================================
       4. PAGARBOOK SALARY CALCULATION ENGINE
       ========================================================================= */
    function calculateEmployeePayroll(emp, yearMonth = uiState.selectedMonth) {
      const daysInMonth = getDaysInMonth(yearMonth);
      const shiftHours = parseShiftHours(emp.shiftStart, emp.shiftEnd);

      let dailyRate = 0;
      let hourlyRate = 0;

      if (emp.salaryType === 'Monthly') {
        dailyRate = emp.baseSalary / daysInMonth;
        hourlyRate = dailyRate / shiftHours;
      } else if (emp.salaryType === 'Daily') {
        dailyRate = emp.baseSalary;
        hourlyRate = dailyRate / shiftHours;
      } else {
        // Hourly
        hourlyRate = emp.baseSalary;
        dailyRate = hourlyRate * shiftHours;
      }

      let countP = 0, countHD = 0, countA = 0, countPL = 0, countWO = 0;
      let earnedDaysPay = 0;
      let totalOtHours = 0;
      let otPay = 0;
      let totalLateFines = 0;

      // Aggregate Attendance for selected month
      Object.values(appData.attendance).forEach(rec => {
        if (rec.empId !== emp.id || !rec.date.startsWith(yearMonth)) return;
        if (rec.status === 'P')  { countP++;  earnedDaysPay += dailyRate; }
        else if (rec.status === 'HD') { countHD++; earnedDaysPay += dailyRate * 0.5; }
        else if (rec.status === 'A')  { countA++; }
        else if (rec.status === 'PL') { countPL++; earnedDaysPay += dailyRate; }
        else if (rec.status === 'WO') { countWO++; earnedDaysPay += dailyRate; }

        const ot = Number(rec.otHours) || 0;
        const fine = Number(rec.lateFine) || 0;
        totalOtHours += ot;
        otPay += ot * hourlyRate;
        totalLateFines += fine;
      });

      // Aggregate Ledger entries for selected month
      let bonuses = 0;
      let deductions = 0;
      let advancesAndPayouts = 0;

      const empLedger = appData.ledger.filter(tx => tx.empId === emp.id && tx.date.startsWith(yearMonth));
      empLedger.forEach(tx => {
        const amt = Number(tx.amount) || 0;
        if (tx.type === 'bonus') bonuses += amt;
        else if (tx.type === 'deduction') deductions += amt;
        else if (tx.type === 'advance' || tx.type === 'salary_payout') advancesAndPayouts += amt;
      });

      const openingBalance = Number(emp.openingBalance) || 0;
      const grossEarned = earnedDaysPay + otPay + bonuses;
      const totalDeductions = totalLateFines + deductions + advancesAndPayouts;
      const netPending = openingBalance + grossEarned - totalDeductions;

      return {
        daysInMonth,
        shiftHours,
        dailyRate,
        hourlyRate,
        countP,
        countHD,
        countA,
        countPL,
        countWO,
        payableDays: countP + countPL + countWO + (countHD * 0.5),
        earnedDaysPay: Math.round(earnedDaysPay),
        totalOtHours,
        otPay: Math.round(otPay),
        bonuses: Math.round(bonuses),
        totalLateFines: Math.round(totalLateFines),
        deductions: Math.round(deductions),
        advancesAndPayouts: Math.round(advancesAndPayouts),
        openingBalance: Math.round(openingBalance),
        grossEarned: Math.round(grossEarned),
        netPending: Math.round(netPending)
      };
    }

      const container = document.getElementById('toast-container');
      const colors = {

        error: 'bg-rose-600 text-white border-rose-400',
        info: 'bg-slate-800 text-white border-amber-400'

      const icons = {
        success: 'fa-circle-check text-emerald-400',
        error: 'fa-circle-exclamation text-white',
        info: 'fa-circle-info text-amber-400'
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border-l-4 text-sm font-medium transition-all duration-300 ${colors[type] || colors.success}`;
      toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.success}"></i><span class="flex-1">${escapeHTML(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

      const todayRec = appData.attendance[`${emp.id}_${todayISO}`] || {};
      const pay = calculateEmployeePayroll(emp, ym);

      const isPunchedIn = Boolean(todayRec.punchIn && !todayRec.punchOut);
      const isShiftDone = Boolean(todayRec.punchIn && todayRec.punchOut);

      // Calendar for employee view
      const [year, month] = ym.split('-').map(Number);
      const daysInMonth = getDaysInMonth(ym);

        const meta = rec?.status ? ATTENDANCE_META[rec.status] : null;

            meta ? meta.cal : 'bg-slate-100 text-slate-500'

            <span>${d}</span>
            <span class="text-[8px] opacity-90">${rec?.status || ''}</span>

       ========================================================================= */
    function handlePortalSelfieUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        // Resize image to lightweight thumbnail so localStorage never overflows
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 220;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = (h * maxDim) / w; w = maxDim; }
          else if (h > maxDim) { w = (w * maxDim) / h; h = maxDim; }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          uiState.portalSelfiePreview = canvas.toDataURL('image/jpeg', 0.65);
          showToast('Selfie captured! Ready to Punch In.', 'info');
          renderApp();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleEmployeePunch(empId, direction) {
      const todayISO = getTodayISO();
      const key = `${empId}_${todayISO}`;
      const timeNow = formatTimeNow();

      const commitPunch = (lat, lng, label) => {
        const existing = appData.attendance[key] || { empId, date: todayISO, status: 'P', otHours: 0, lateFine: 0, notes: '' };
        if (direction === 'in') {
          appData.attendance[key] = {
            ...existing,
            status: 'P',
            punchIn: timeNow,
            lat,
            lng,
            locationLabel: label,
            selfie: uiState.portalSelfiePreview || existing.selfie || null
          };
          uiState.portalSelfiePreview = null;
          showToast(`Punched In at ${timeNow} (${label})`);
        } else {
          appData.attendance[key] = {
            ...existing,
            punchOut: timeNow
          };
          showToast(`Punched Out at ${timeNow}. Great work today!`);
        }
        saveData();
        renderApp();
      };

      // Capture real Geolocation with graceful fallback to Pune/Nagpur coordinates
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => commitPunch(pos.coords.latitude, pos.coords.longitude, 'Live GPS Verified'),
          () => commitPunch(18.5204 + (Math.random() * 0.02 - 0.01), 73.8567 + (Math.random() * 0.02 - 0.01), 'Pune Site (Fallback GPS)'),
          { timeout: 3500 }
        );
      } else {
        commitPunch(18.5204, 73.8567, 'Pune Site (Fallback GPS)');
      }
    }

    /* =========================================================================
       13. CSV EXPORTS & RESET DEMO DATA
       ========================================================================= */
    function downloadCSV(filename, rows) {
      const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportPayrollCSV() {
      const ym = uiState.selectedMonth;
      const headers = ['Employee Name', 'Phone', 'Role', 'Salary Type', 'Base Salary (INR)', 'Present', 'Half Day', 'Absent', 'PL/WO', 'Payable Days', 'Earned Pay', 'OT Hours', 'OT Pay', 'Bonuses', 'Late Fines', 'Deductions', 'Advances/Paid', 'Opening Balance', 'Net Pending (INR)'];
      const rows = [headers];
      appData.employees.forEach(emp => {
        const p = calculateEmployeePayroll(emp, ym);
        rows.push([
          emp.name, emp.phone, emp.role, emp.salaryType, emp.baseSalary,
          p.countP, p.countHD, p.countA, p.countPL + p.countWO, p.payableDays,
          p.earnedDaysPay, p.totalOtHours, p.otPay, p.bonuses,
          p.totalLateFines, p.deductions, p.advancesAndPayouts, p.openingBalance, p.netPending
        ]);
      });
      downloadCSV(`Solectrik_Payroll_${ym}.csv`, rows);
      showToast(`Exported Solectrik_Payroll_${ym}.csv`);
    }

    function exportLeadsCSV() {
      const headers = ['Customer Name', 'Phone', 'City/Area', 'Lead Source', 'Generated By', 'Proposed kW', 'Stage', 'Logged At', 'Notes'];
      const rows = [headers];
      appData.leads.forEach(l => {
        const emp = getEmployeeById(l.assignedEmpId);
        rows.push([l.customerName, l.phone, l.city, l.source, emp ? emp.name : '', l.kwCapacity, l.stage, l.createdAt, l.notes]);

      downloadCSV(`Solectrik_Leads_Audit_${getTodayISO()}.csv`, rows);
